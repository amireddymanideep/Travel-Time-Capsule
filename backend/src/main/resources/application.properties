server.port=${PORT:8080}
server.error.include-message=always

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/travel_capsule}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-before-deployment}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai.model=${OPENAI_MODEL:gpt-4o-mini}
